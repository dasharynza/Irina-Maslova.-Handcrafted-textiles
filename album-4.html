<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="icon.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогодняя Коллекция 2027 | Галерея работ</title>
    <link rel="stylesheet" href="style for albums.css">
</head>
<body>

    <!-- ШАПКА СТРАНИЦЫ С ЗАГОЛОВКОМ И КНОПКОЙ НАЗАД -->
    <header class="album-header">
        <div class="container">
            <a href="index.html" class="back-btn">← Назад на главную</a>
            <h1>коллекция наволочек на подушки 40x40 см.</h1>
        </div>
    </header>

    <!-- СЕТКА С ФОТОГРАФИЯМИ -->
    <main class="album-gallery">
        <div class="container">
            <div class="photos-grid">
                
                <!-- фоторафии альбома 4 -->
                <div class="photo-card">
                    <img src="подушки в отдельную1.jpg" alt="подушки 1" loading="lazy">
                </div>

                <div class="photo-card">
                    <img src="подушки в отдельную 2.jpg" alt="подушки 2" loading="lazy">
                </div>

                <div class="photo-card">
                    <img src="подушки в отдельную 3.jpg" alt="подушки 3" loading="lazy">
                </div>

                <div class="photo-card">
                    <img src="подушки в отдельную 4.jpg" alt="подушки 4" loading="lazy">
                </div>

                <div class="photo-card">
                    <img src="подушки в отдельную 5.png" alt="подушки 5" loading="lazy">
                </div>

                <div class="photo-card">
                    <img src="подушки с котами.jpg" alt="подушка с котами">
                </div>

                <div class="photo-card">
                    <img src="foto 13 jpg.jpg" alt="подушка из нг 27">
                </div>

                <div class="photo-card">
                    <img src="foto 16.jpg" alt="подушка из нг 26">
                </div>

            </div>
        </div>
    </main>

</body>
</html>
